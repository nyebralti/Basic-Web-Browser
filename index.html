<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Web Browser</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 20px;
            background: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            font-weight: 600;
        }

        .subtitle {
            margin-top: 12px;
            color: #666;
            font-size: 18px;
        }

        .description {
            margin: 30px auto;
            line-height: 1.6;
            color: #555;
            max-width: 520px;
        }

        .download {
            display: inline-block;
            padding: 15px 35px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        .download:hover {
            background: #444;
            transform: translateY(-2px);
        }

        .info {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }

        footer {
            margin-top: 45px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">B</div>

        <h1>Basic Web Browser</h1>

        <div class="subtitle">
            Basit. Hafif. Gereksiz özellikler yok.
        </div>

        <p class="description">
            Basic Web Browser, internette gezinmek için hazırlanmış
            sade bir web tarayıcısıdır.
            Gereksiz özellikler ve karmaşık sistemler yerine
            temel web deneyimine odaklanır.
        </p>

        <a
            class="download"
            href="browser.exe"
            download="browser.exe"
        >
            ⬇ İndir
        </a>

        <div class="info">
            Windows • browser.exe
        </div>

        <footer>
            © 2026 Basic Web Browser
        </footer>

    </main>

</body>
</html>
